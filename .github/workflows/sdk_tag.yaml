name: Tag SDK samples
permissions:
  contents: read
"on":
  push:
    branches:
      - main
  workflow_dispatch: {}
jobs:
  # Calls the action directly rather than Speakeasy's shared tag workflow, so the
  # job can run in the sdk-generate Environment, the only place SPEAKEASY_API_KEY
  # is available.
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sdk-generate
    steps:
      - name: Apply tags in the Speakeasy registry
        uses: speakeasy-api/sdk-generation-action@6cd5ba5c0f635337847068ad8410ca9a8651e175 # v15
        with:
          action: tag
          registry_tags: main
          speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
          github_access_token: ${{ github.token }}
