name: Publish SDK
"on":
  workflow_run: # zizmor: ignore[dangerous-triggers] never checks out or runs PR code
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      mode: ${{ github.event_name == 'workflow_dispatch' && 'manual' || steps.gate.outputs.mode }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - name: Require a green CI run on this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?head_sha=$SHA&branch=main&event=push&status=success" --jq '.total_count')
          if [ "$passed" = "0" ]; then
            echo "::error::CI hasn't passed on main for $SHA, so it can't be released"
            exit 1
          fi

      - id: gate
        uses: gr4vy/sdk-release/publish-gate@c8db692714898b3bed56d5a7df32f44db9b2055c
        with:
          head-sha: ${{ github.event.workflow_run.head_sha || github.sha }}
          bot-login: gr4vy-sdk-release[bot]

  request-approval:
    needs: gate
    if: needs.gate.outputs.publish == 'true' && needs.gate.outputs.mode == 'manual'
    runs-on: ubuntu-latest
    steps:
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2
        env:
            SLACK_USERNAME: Java SDK
            SLACK_TITLE: Java SDK
            SLACK_WEBHOOK: ${{ secrets.SLACK_SDK_WEBHOOK_URL }}
            SLACK_CHANNEL: sdk-updates
            SLACK_MSG_AUTHOR: gr4vy
            SLACK_ICON_EMOJI: ":gr4vy-sdk:"
            SLACK_COLOR: "#F3AB0E"
            SLACK_MESSAGE: "v${{ needs.gate.outputs.version }} is waiting for release approval: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            SLACK_FOOTER: ""

  approve:
    needs: gate
    if: needs.gate.outputs.publish == 'true' && needs.gate.outputs.mode == 'manual'
    runs-on: ubuntu-latest
    environment: release-manual
    steps:
      - run: echo "Release approved."

  # Builds, signs and uploads to Maven Central (Sonatype Central Portal), then has
  # the release bot tag the commit.
  publish:
    needs: [gate, approve]
    if: >-
      always() && needs.gate.outputs.publish == 'true' &&
      (needs.gate.outputs.mode == 'auto' || needs.approve.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: sdk-release
    steps:
      - name: Mint a gr4vy-sdk-release token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SDK_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SDK_RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Use Java 11
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: corretto
          java-version: 11

      - name: Check the version
        id: version
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          GRADLE_VERSION=$(sed -n 's/^version=//p' gradle.properties)
          if [ "$GRADLE_VERSION" != "$VERSION" ]; then
            echo "::error::gradle.properties is $GRADLE_VERSION but gen.lock is $VERSION"
            exit 1
          fi
          if curl -sf "https://repo1.maven.org/maven2/com/gr4vy/sdk/$VERSION/sdk-$VERSION.pom" >/dev/null; then
            echo "com.gr4vy:sdk:$VERSION is already on Maven Central"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Maven Central
        if: steps.version.outputs.published != 'true'
        env:
          SONATYPE_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SONATYPE_SIGNING_KEY: ${{ secrets.JAVA_GPG_SECRET_KEY }}
          SIGNING_KEY_PASSPHRASE: ${{ secrets.JAVA_GPG_PASSPHRASE }}
        run: ./gradlew build sonatypeCentralUpload --no-daemon --console=plain

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.gate.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          {
            echo "[com.gr4vy:sdk $VERSION](https://central.sonatype.com/artifact/com.gr4vy/sdk/$VERSION)"
            echo
            yq -r '.releaseNotes // ""' .speakeasy/gen.lock
          } > release-notes.md
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "java - v$VERSION" --notes-file release-notes.md

  notify:
    needs: [gate, publish]
    runs-on: ubuntu-latest
    if: always() && (needs.gate.result == 'failure' || needs.publish.result != 'skipped')
    steps:
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2
        env:
            SLACK_USERNAME: Java SDK
            SLACK_TITLE: Java SDK
            SLACK_WEBHOOK: ${{ secrets.SLACK_SDK_WEBHOOK_URL }}
            SLACK_CHANNEL: sdk-updates
            SLACK_MSG_AUTHOR: gr4vy
            SLACK_ICON_EMOJI: ":gr4vy-sdk:"
            SLACK_COLOR: "${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}"
            SLACK_MESSAGE_ON_SUCCESS: "SDK publishing succeeded - `${{ github.event.workflow_run.head_commit.message || 'manual dispatch' }}`"
            SLACK_MESSAGE_ON_FAILURE: "SDK publishing failed - `${{ github.event.workflow_run.head_commit.message || 'manual dispatch' }}`"
            SLACK_FOOTER: ""
