name: Dependency graph
"on":
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions: {}

jobs:
  # GitHub can't read build.gradle on its own, so without this the dependency
  # graph lists no Maven libraries and Dependabot raises no Java alerts.
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
        with:
          persist-credentials: false
      - name: Use Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: corretto
          java-version: 21
      - name: Submit the Gradle dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
